[package]
name = "rust-mirror-select"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust-mirror-select"
path = "src/cli.rs"
required-features = ["cli"]

[[example]]
name = "basic"
required-features = ["dns"]

[features]
default = ["dns", "toml"]
all = ["cli", "dns", "toml", "ping-select", "speedtest-select"]
cli = ["dep:clap"]
dns = ["dep:simple-dns", "dep:tokio", "dep:resolv-conf", "dep:windows-sys"]
toml = ["dep:toml"]
ping-select = ["dep:tokio"]
speedtest-select = ["dep:reqwest"]

[dependencies]
base64 = "0.23.1"
bitflags = "2.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
url = { version = "2.4", features = ["serde"] }

clap = { version = "4", features = ["derive"], optional = true }

tokio = { version = "1.26.0", features = ["rt-multi-thread", "macros", "net", "time"], optional = true }
simple-dns = { version = "0.12.0", optional = true }
toml = { version = "1.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "http2", "socks", "stream"], optional = true }

[target."cfg(unix)".dependencies]
resolv-conf = { version = "0.7", optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"], optional = true }

[dev-dependencies]
tokio = { version = "1.26.0", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
